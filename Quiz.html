<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8">
        
        <div id="landing-page" class="space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-slate-800">Quiz Challenge</h1>
                <p class="text-slate-500 mt-2">Choose your difficulty to begin</p>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Difficulty Level</label>
                <select id="difficulty-select" class="w-full p-4 rounded-xl border-2 border-slate-100 focus:border-blue-500 outline-none transition-all cursor-pointer">
                    <option value="easy">Easy (General Basics)</option>
                    <option value="medium">Medium (Intermediate)</option>
                    <option value="hard">Hard (Advanced)</option>
                </select>
            </div>

            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">
                Start Quiz
            </button>
        </div>

        <div id="quiz-page" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <span id="progress" class="text-sm font-bold text-slate-400 uppercase tracking-widest">Question 1/5</span>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 text-sm">Timer:</span>
                    <span id="timer" class="text-blue-600 font-mono text-2xl font-black">15s</span>
                </div>
            </div>
            
            <h2 id="question-text" class="text-2xl font-bold text-slate-800 leading-snug min-h-[4rem]">Loading...</h2>
            
            <div id="options-container" class="grid gap-4">
                </div>
            
            <button id="next-btn" class="hidden w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-all">
                Next Question
            </button>
        </div>

        <div id="result-page" class="hidden text-center space-y-8">
            <div>
                <h2 class="text-3xl font-black text-slate-800">Quiz Complete!</h2>
                <p id="score-summary" class="text-slate-500 mt-2 text-lg"></p>
            </div>
            
            <div class="relative h-64 mx-auto">
                <canvas id="resultsChart"></canvas>
            </div>
            
            <button onclick="location.reload()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all">
                Try a Different Difficulty
            </button>
        </div>
    </div>

    <script>
        const quizData = {
            easy: [
                { q: "What is the capital of Italy?", o: ["Venice", "Florence", "Rome", "Naples"], a: 2 },
                { q: "Which animal is known as the King of the Jungle?", o: ["Tiger", "Elephant", "Lion", "Giraffe"], a: 2 },
                { q: "How many days are in a leap year?", o: ["364", "365", "366", "367"], a: 2 }
            ],
            medium: [
                { q: "Which element has the chemical symbol 'O'?", o: ["Gold", "Oxygen", "Osmium", "Silver"], a: 1 },
                { q: "What is the largest planet in our solar system?", o: ["Earth", "Saturn", "Jupiter", "Neptune"], a: 2 },
                { q: "Who painted the Mona Lisa?", o: ["Van Gogh", "Picasso", "Da Vinci", "Monet"], a: 2 }
            ],
            hard: [
                { q: "What is the smallest prime number?", o: ["0", "1", "2", "3"], a: 2 },
                { q: "Which gas is most abundant in Earth's atmosphere?", o: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Argon"], a: 2 },
                { q: "What is the boiling point of water at sea level?", o: ["90°C", "100°C", "110°C", "120°C"], a: 1 }
            ]
        };

        let currentIdx = 0, timer, timeLeft = 15, activeQuestions = [];
        let results = { correct: 0, incorrect: 0 };

        document.getElementById('start-btn').onclick = () => {
            const diff = document.getElementById('difficulty-select').value;
            activeQuestions = quizData[diff]; // Filter by difficulty
            
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        };

        function loadQuestion() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer').innerText = `${timeLeft}s`;
            
            const data = activeQuestions[currentIdx];
            document.getElementById('progress').innerText = `Question ${currentIdx + 1}/${activeQuestions.length}`;
            document.getElementById('question-text').innerText = data.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            data.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-5 rounded-xl border-2 border-slate-100 hover:border-blue-500 hover:bg-blue-50 transition-all font-semibold text-slate-700 shadow-sm";
                btn.id = `option-${i}`; 
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    validateAndNext(-1); 
                }
            }, 1000);
        }

        function selectOption(index, selectedBtn) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.replace('border-blue-500', 'border-slate-100');
                btn.classList.remove('bg-blue-50', 'ring-2', 'ring-blue-100');
            });
            selectedBtn.classList.replace('border-slate-100', 'border-blue-500');
            selectedBtn.classList.add('bg-blue-50', 'ring-2', 'ring-blue-100');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.onclick = () => validateAndNext(index);
        }

        function validateAndNext(selectedIndex) {
            if (selectedIndex === activeQuestions[currentIdx].a) results.correct++;
            else results.incorrect++;

            currentIdx++;
            if (currentIdx < activeQuestions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            document.getElementById('score-summary').innerText = `Correct Answers: ${results.correct} | Incorrect: ${results.incorrect}`;
            
            new Chart(document.getElementById('resultsChart'), {
                type: 'pie',
                data: {
                    labels: ['Correct', 'Incorrect'],
                    datasets: [{
                        data: [results.correct, results.incorrect],
                        backgroundColor: ['#2563eb', '#f87171'],
                        hoverOffset: 4
                    }]
                },
                options: { maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
